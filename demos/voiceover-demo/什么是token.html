<script type="text/babel">
/* assumptions: speaker 跟讲 · 无 TTS · 无整句字幕 · 无技能水印
   hero: 两枚 glyph 从问号 morph 成 token，再劈成「人工 / 智能」 */
const TIMELINE = {"title": "什么是 token", "pace": "speaker", "totalDuration": 14, "scenes": [{"id": "intro", "start": 0, "end": 3.2, "duration": 3.2, "text": "你有没有想过，当我们和 AI 对话的时候，AI 到底是怎么理解我们的话的呢。", "chunks": [{"text": "你有没有想过，", "start": 0, "end": 1.6, "absoluteStart": 0, "absoluteEnd": 1.6}, {"text": "当我们和 AI 对话的时候，AI 到底是怎么理解我们的话的呢。", "start": 1.6, "end": 3.2, "absoluteStart": 1.6, "absoluteEnd": 3.2}], "cues": [{"id": "question", "offset": 1.6, "absoluteTime": 1.6, "prompt": "当我们和 AI 对话的时候，AI 到底是怎么理解我们的话的呢。"}]}, {"id": "token-1", "start": 3.6, "end": 6.800000000000001, "duration": 3.2000000000000006, "text": "答案是它根本不理解汉字，它只认识 token。", "chunks": [{"text": "答案是它根本不理解汉字，", "start": 0, "end": 1.6, "absoluteStart": 3.6, "absoluteEnd": 5.2}, {"text": "它只认识 token。", "start": 1.6, "end": 3.2, "absoluteStart": 5.2, "absoluteEnd": 6.800000000000001}], "cues": [{"id": "reveal", "offset": 1.6, "absoluteTime": 5.2, "prompt": "它只认识 token。"}]}, {"id": "token-2", "start": 7.200000000000001, "end": 10.4, "duration": 3.1999999999999993, "text": "你可以把 token 理解成 AI 的最小信息单位。\n比如「人工智能」这四个字，在 AI 眼里可能是两个 token：人工，智能。", "chunks": [{"text": "你可以把 token 理解成 AI 的最小信息单位。\n比如「人工智能」这四个字，", "start": 0, "end": 1.6, "absoluteStart": 7.200000000000001, "absoluteEnd": 8.8}, {"text": "在 AI 眼里可能是两个 token：人工，智能。", "start": 1.5999999999999996, "end": 3.1999999999999997, "absoluteStart": 8.8, "absoluteEnd": 10.4}], "cues": [{"id": "split", "offset": 1.5999999999999996, "absoluteTime": 8.8, "prompt": "在 AI 眼里可能是两个 token：人工，智能。"}]}, {"id": "ending", "start": 10.8, "end": 14, "duration": 3.1999999999999993, "text": "所以下次看到「百万 token 上下文」这种说法，你就知道，它说的是 AI 一次能记住多少个这样的小块。", "chunks": [{"text": "所以下次看到「百万 token 上下文」这种说法，", "start": 0, "end": 1.6, "absoluteStart": 10.8, "absoluteEnd": 12.4}, {"text": "你就知道，它说的是 AI 一次能记住多少个这样的小块。", "start": 1.5999999999999996, "end": 3.1999999999999997, "absoluteStart": 12.4, "absoluteEnd": 14}], "cues": [{"id": "context", "offset": 1.5999999999999996, "absoluteTime": 12.4, "prompt": "你就知道，它说的是 AI 一次能记住多少个这样的小块。"}]}]};

/**
 * narration_stage.jsx · 知识演讲舞台引擎
 *
 * 从 huashu-design 的解说 Stage 抽出，默认时间源改成「讲者按空格」。
 *
 * 铁律：hero 挂在 <NarrationStage> 子级，不要放进 <Scene>。
 * 失败模式：每段独立 layout + 整页 opacity 切 = 带旁白的 PPT。
 *
 * 用法（必须内联进 HTML，禁止 src="narration_stage.jsx"）：
 *   const { NarrationStage, Scene, Cue, useNarration, useSceneFade } = NarrationStageLib;
 *
 *   <NarrationStage timeline={TIMELINE} mode="speaker" width={1920} height={1080}>
 *     <HeroAnchor />
 *     <Scene id="hook-pain">...</Scene>
 *   </NarrationStage>
 *
 * 键盘（speaker 模式）：
 *   Space / → / PageDown  下一拍
 *   ← / PageUp            上一拍
 *   Home / End            首拍 / 末拍
 *   N                     提词条
 *   F                     舞台全屏
 */

const NarrationStageLib = (() => {
  const NarrationContext = React.createContext({
    time: 0,
    scene: null,
    sceneTime: 0,
    sceneMorph: 1,
    isCueTriggered: () => false,
    cueProgress: () => 0,
    timeline: { scenes: [] },
    mode: 'speaker',
    beatIndex: 0,
  });

  const expoOut = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));

  /** 把各段 cue 压成线性拍点列表；没有 cue 的段用段起点占一拍 */
  function beatsFromTimeline(timeline) {
    const beats = [];
    for (const s of timeline.scenes || []) {
      if (s.cues && s.cues.length) {
        for (const c of s.cues) {
          beats.push({
            id: c.id,
            time: c.absoluteTime,
            // +1.05s：让 cue ramp（默认 0.5s）和 sceneMorph（1s）都能走完再 hold
            hold: c.absoluteTime + 1.05,
            sceneId: s.id,
            prompt: c.prompt || '',
          });
        }
      } else {
        beats.push({
          id: `${s.id}-start`,
          time: s.start,
          hold: s.start + 1.05,
          sceneId: s.id,
          prompt: (s.text || '').slice(0, 80),
        });
      }
    }
    return beats;
  }

  function findScene(timeline, time) {
    const scenes = timeline.scenes || [];
    if (!scenes.length) return null;
    for (let i = 0; i < scenes.length; i++) {
      const s = scenes[i];
      const next = scenes[i + 1];
      if (time >= s.start && (!next || time < next.start)) return s;
    }
    return scenes[0];
  }

  /**
   * 主舞台
   *
   * mode:
   *   speaker — 默认。空格推进到下一拍的 hold 点，到达后 freeze（讲者继续说话）。
 *   audio   — 跟已有 audio 的 currentTime（仅当用户自己提供音轨时）。
 *   省略    — 有 audioSrc 则 audio，否则 speaker。
 * 本技能不产出 MP4 / TTS；默认走 speaker。
   */
  function NarrationStage({
    timeline,
    audioSrc = null,
    mode: modeProp,
    width = 1920,
    height = 1080,
    background = '#f4f1ea',
    controls = true,
    prompt: promptProp = true,
    children,
  }) {
    const mode = modeProp || (audioSrc ? 'audio' : 'speaker');
    const recording = typeof window !== 'undefined' && window.__recording === true;
    const beats = React.useMemo(() => beatsFromTimeline(timeline), [timeline]);
    const audioRef = React.useRef(null);
    const stageRef = React.useRef(null);
    const tweenRef = React.useRef(null);

    const [time, setTime] = React.useState(0);
    const [beatIndex, setBeatIndex] = React.useState(-1);
    const [playing, setPlaying] = React.useState(false);
    const [showPrompt, setShowPrompt] = React.useState(promptProp);
    const [sceneMorph, setSceneMorph] = React.useState(1);
    const sceneIdRef = React.useRef(null);

    const totalDuration = timeline.totalDuration || (beats.length ? beats[beats.length - 1].hold : 1);

    React.useEffect(() => {
      if (typeof window === 'undefined') return;
      window.__totalDuration = totalDuration;
      window.__ready = true;
      window.__seek = (t) => {
        setTime(t);
        const idx = beats.findIndex((b) => t <= b.hold + 0.01);
        setBeatIndex(idx < 0 ? beats.length - 1 : idx);
      };
    }, [totalDuration, beats]);

    const currentScene = React.useMemo(() => findScene(timeline, time), [timeline, time]);

    // scene 一切换，用真实时间 1s 把 sceneMorph 从 0→1。
    // 这样现场 hold 在 cue+1s 时 morph 已经走完；不会因为「段的讲话时长」把 morph 拉爆或跳过。
    React.useEffect(() => {
      const id = currentScene && currentScene.id;
      if (!id) return;
      if (sceneIdRef.current === id) return;
      const isFirst = sceneIdRef.current === null;
      sceneIdRef.current = id;
      if (isFirst) {
        setSceneMorph(1);
        return;
      }
      if (recording) return;
      let start = performance.now();
      let raf;
      const tick = (now) => {
        const p = Math.min(1, (now - start) / 1000);
        setSceneMorph(p);
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      setSceneMorph(0);
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, [currentScene && currentScene.id, recording]);

    // 录制模式：sceneMorph 跟时间轴，保证逐帧可 seek
    React.useEffect(() => {
      if (!recording || !currentScene) return;
      setSceneMorph(Math.min(1, Math.max(0, (time - currentScene.start) / 1.0)));
    }, [recording, time, currentScene]);

    const sceneTime = currentScene ? Math.max(0, time - currentScene.start) : 0;

    const allCues = React.useMemo(() => {
      const map = {};
      for (const s of timeline.scenes || []) {
        for (const c of s.cues || []) map[c.id] = c;
      }
      return map;
    }, [timeline.scenes]);

    const isCueTriggered = React.useCallback(
      (cueId) => {
        const c = allCues[cueId];
        return c ? time >= c.absoluteTime : false;
      },
      [allCues, time],
    );

    const cueProgress = React.useCallback(
      (cueId, ramp = 0.5) => {
        const c = allCues[cueId];
        if (!c) return 0;
        const dt = time - c.absoluteTime;
        if (dt <= 0) return 0;
        if (dt >= ramp) return 1;
        return dt / ramp;
      },
      [allCues, time],
    );

    /** 现场：把 time 在 1s 内 expoOut 推到目标 hold 点，然后冻结 */
    const tweenTo = React.useCallback((targetTime, targetIndex) => {
      if (tweenRef.current) cancelAnimationFrame(tweenRef.current);
      const from = time;
      const dist = targetTime - from;
      if (Math.abs(dist) < 0.001) {
        setTime(targetTime);
        setBeatIndex(targetIndex);
        return;
      }
      const dur = 1000;
      const t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        setTime(from + dist * expoOut(p));
        if (p < 1) {
          tweenRef.current = requestAnimationFrame(step);
        } else {
          setTime(targetTime);
          setBeatIndex(targetIndex);
          tweenRef.current = null;
        }
      };
      setBeatIndex(targetIndex);
      tweenRef.current = requestAnimationFrame(step);
    }, [time]);

    const goBeat = React.useCallback(
      (index) => {
        if (!beats.length) return;
        // -1 = 起幅（time=0，第一个 cue 尚未触发）。避免首按空格跳过第一拍。
        const i = Math.max(-1, Math.min(beats.length - 1, index));
        if (i < 0) {
          tweenTo(0, -1);
          return;
        }
        tweenTo(beats[i].hold, i);
      },
      [beats, tweenTo],
    );

    // 音频模式：rAF 跟随 currentTime
    React.useEffect(() => {
      if (mode !== 'audio' && !recording) return undefined;
      let raf;
      if (recording) {
        let startedAt = null;
        const tick = (now) => {
          if (startedAt === null) startedAt = now;
          setTime(Math.min((now - startedAt) / 1000, totalDuration));
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        if (typeof window !== 'undefined') {
          window.__seek = (t) => {
            startedAt = performance.now() - t * 1000;
            setTime(t);
          };
        }
      } else {
        const tick = () => {
          if (audioRef.current && !audioRef.current.paused) {
            setTime(audioRef.current.currentTime);
          }
          raf = requestAnimationFrame(tick);
        };
        tick();
      }
      return () => cancelAnimationFrame(raf);
    }, [mode, recording, totalDuration]);

    // 键盘只在 speaker 且非录制时生效
    React.useEffect(() => {
      if (mode !== 'speaker' || recording) return undefined;
      const onKey = (e) => {
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        const k = e.key;
        if (k === ' ' || k === 'ArrowRight' || k === 'PageDown') {
          e.preventDefault();
          goBeat(beatIndex + 1);
        } else if (k === 'ArrowLeft' || k === 'PageUp') {
          e.preventDefault();
          goBeat(beatIndex - 1);
        } else if (k === 'Home') {
          e.preventDefault();
          goBeat(-1);
        } else if (k === 'End') {
          e.preventDefault();
          goBeat(beats.length - 1);
        } else if (k === 'n' || k === 'N') {
          setShowPrompt((v) => !v);
        } else if (k === 'f' || k === 'F') {
          const el = stageRef.current && stageRef.current.parentElement;
          if (!el) return;
          if (document.fullscreenElement) document.exitFullscreen();
          else el.requestFullscreen && el.requestFullscreen();
        }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [mode, recording, beatIndex, beats.length, goBeat]);

    const handlePlayPause = () => {
      if (!audioRef.current) return;
      if (audioRef.current.paused) {
        audioRef.current.play();
        setPlaying(true);
      } else {
        audioRef.current.pause();
        setPlaying(false);
      }
    };

    const handleSeek = (e) => {
      const t = parseFloat(e.target.value);
      if (audioRef.current) audioRef.current.currentTime = t;
      setTime(t);
    };

    const beat = beatIndex >= 0 ? beats[beatIndex] : null;
    const openingPrompt = (() => {
      const s = timeline.scenes && timeline.scenes[0];
      if (!s) return '';
      if (s.chunks && s.chunks[0] && s.chunks[0].text) return s.chunks[0].text;
      return s.text || '';
    })();
    const ctx = {
      time,
      scene: currentScene,
      sceneTime,
      sceneMorph,
      isCueTriggered,
      cueProgress,
      timeline,
      mode,
      beatIndex,
    };

    const chromeWidth = width;

    return (
      <NarrationContext.Provider value={ctx}>
        <div ref={stageRef} style={{ position: 'relative', width, height, background, overflow: 'hidden' }}>
          {children}
        </div>
        {mode === 'audio' && audioSrc && !recording && (
          <audio ref={audioRef} src={audioSrc} preload="auto" onEnded={() => setPlaying(false)} />
        )}
        {!recording && controls && (
          <div
            style={{
              display: 'flex',
              alignItems: 'center',
              gap: 12,
              padding: '10px 16px',
              background: '#1a1a1a',
              color: '#ddd',
              fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
              fontSize: 13,
              width: chromeWidth,
              boxSizing: 'border-box',
            }}
          >
            {mode === 'speaker' ? (
              <>
                <button type="button" onClick={() => goBeat(beatIndex - 1)} style={chromeBtn}>
                  ←
                </button>
                <button type="button" onClick={() => goBeat(beatIndex + 1)} style={chromeBtn}>
                  Space →
                </button>
              </>
            ) : (
              <button type="button" onClick={handlePlayPause} style={chromeBtn}>
                {playing ? 'Pause' : 'Play'}
              </button>
            )}
            {mode === 'audio' && (
              <input
                type="range"
                min={0}
                max={totalDuration}
                step={0.01}
                value={time}
                onChange={handleSeek}
                style={{ flex: 1 }}
              />
            )}
            <span style={{ minWidth: 110, textAlign: 'right', opacity: 0.8 }}>
              {time.toFixed(2)} / {totalDuration.toFixed(2)}s
            </span>
            <span style={chromeTag}>{currentScene ? currentScene.id : '—'}</span>
            <span style={chromeTag}>{beat ? beat.id : '—'}</span>
            {mode === 'speaker' && (
              <span style={{ opacity: 0.55, marginLeft: 'auto' }}>N 提词 · F 全屏</span>
            )}
          </div>
        )}
        {!recording && mode === 'speaker' && showPrompt && ((beat && beat.prompt) || (!beat && openingPrompt)) && (
          <div
            style={{
              width: chromeWidth,
              boxSizing: 'border-box',
              padding: '10px 20px 14px',
              background: '#111',
              color: '#e8e4dc',
              fontFamily: '"Noto Sans SC", "PingFang SC", sans-serif',
              fontSize: 18,
              lineHeight: 1.5,
            }}
          >
            {beat ? beat.prompt : openingPrompt}
          </div>
        )}
      </NarrationContext.Provider>
    );
  }

  const chromeBtn = {
    padding: '6px 12px',
    background: '#fff',
    color: '#000',
    border: 0,
    borderRadius: 4,
    cursor: 'pointer',
    fontWeight: 600,
  };
  const chromeTag = {
    padding: '4px 10px',
    background: '#2a2a2a',
    borderRadius: 4,
    maxWidth: 180,
    overflow: 'hidden',
    textOverflow: 'ellipsis',
    whiteSpace: 'nowrap',
  };

  function Scene({ id, children, keepMounted = false }) {
    const { scene, sceneTime } = React.useContext(NarrationContext);
    const isActive = scene && scene.id === id;
    if (!isActive && !keepMounted) return null;
    const content = typeof children === 'function' ? children(sceneTime, scene) : children;
    return (
      <div
        style={{
          position: 'absolute',
          inset: 0,
          opacity: isActive ? 1 : 0,
          pointerEvents: isActive ? 'auto' : 'none',
          transition: keepMounted ? 'opacity 0.35s' : undefined,
        }}
      >
        {content}
      </div>
    );
  }

  function Cue({ id, ramp = 0.5, children }) {
    const { isCueTriggered, cueProgress } = React.useContext(NarrationContext);
    return children(isCueTriggered(id), cueProgress(id, ramp));
  }

  function useNarration() {
    return React.useContext(NarrationContext);
  }

  function visualLen(s) {
    let n = 0;
    for (const ch of s) n += /[a-zA-Z0-9 .,'":;\-]/.test(ch) ? 0.5 : 1;
    return n;
  }

  function splitChunkToLines(text, maxLen = 13) {
    const lines = [];
    const sentences = [];
    let buf = '';
    for (const ch of text) {
      buf += ch;
      if ('。！？\n'.includes(ch)) {
        if (buf.trim()) sentences.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) sentences.push(buf.trim());
    for (const sent of sentences) {
      if (visualLen(sent) <= maxLen) {
        lines.push(sent);
        continue;
      }
      const parts = [];
      let pbuf = '';
      for (const ch of sent) {
        pbuf += ch;
        if ('，、；：'.includes(ch)) {
          parts.push(pbuf);
          pbuf = '';
        }
      }
      if (pbuf) parts.push(pbuf);
      let merged = '';
      for (const p of parts) {
        if (visualLen(merged) + visualLen(p) <= maxLen) merged += p;
        else {
          if (merged) lines.push(merged);
          merged = p;
        }
      }
      if (merged) {
        if (visualLen(merged) <= maxLen) lines.push(merged);
        else {
          let hbuf = '';
          for (const ch of merged) {
            hbuf += ch;
            if (visualLen(hbuf) >= maxLen) {
              lines.push(hbuf);
              hbuf = '';
            }
          }
          if (hbuf) lines.push(hbuf);
        }
      }
    }
    return lines.filter((l) => l.trim());
  }

  function useSceneFade(sceneId, fadeIn = 0.5, fadeOut = 0.5) {
    const { time, timeline } = React.useContext(NarrationContext);
    if (!timeline) return 0;
    const s = timeline.scenes.find((x) => x.id === sceneId);
    if (!s) return 0;
    const inT = (time - s.start) / fadeIn;
    const outT = (s.end - time) / fadeOut;
    return Math.max(0, Math.min(1, Math.min(inT, outT)));
  }

  /** 仅自动播放时可选。现场跟讲不要叠整句字幕，会和讲者抢词。 */
  function Subtitles({
    bottom = 90,
    fontSize = 32,
    color = '#1a1a1a',
    haloColor = 'rgba(245,241,232,0.9)',
    maxLen = 13,
  } = {}) {
    const { time, scene } = React.useContext(NarrationContext);
    if (!scene || !scene.chunks) return null;
    const active = scene.chunks.find((c) => time >= c.absoluteStart && time < c.absoluteEnd);
    if (!active) return null;
    const lines = splitChunkToLines(active.text, maxLen);
    if (!lines.length) return null;
    const totalLen = lines.reduce((s, l) => s + visualLen(l), 0);
    const chunkDur = active.absoluteEnd - active.absoluteStart;
    let acc = active.absoluteStart;
    let activeLine = lines[lines.length - 1];
    let lineStart = active.absoluteStart;
    for (const line of lines) {
      const dur = (visualLen(line) / totalLen) * chunkDur;
      if (time < acc + dur) {
        activeLine = line;
        lineStart = acc;
        break;
      }
      acc += dur;
    }
    const lineProg = Math.min(1, (time - lineStart) / 0.15);
    return React.createElement(
      'div',
      {
        style: {
          position: 'absolute',
          left: 0,
          right: 0,
          bottom,
          display: 'flex',
          justifyContent: 'center',
          pointerEvents: 'none',
          zIndex: 50,
        },
      },
      React.createElement(
        'div',
        {
          key: lineStart,
          style: {
            fontFamily: '"PingFang SC", "Noto Sans SC", sans-serif',
            fontSize,
            fontWeight: 600,
            color,
            letterSpacing: '0.04em',
            lineHeight: 1.2,
            textAlign: 'center',
            textShadow: `0 0 6px ${haloColor}, 0 0 12px ${haloColor}`,
            opacity: lineProg,
            transform: `translateY(${(1 - lineProg) * 4}px)`,
          },
        },
        activeLine,
      ),
    );
  }

  return {
    NarrationStage,
    Scene,
    Cue,
    useNarration,
    useSceneFade,
    Subtitles,
    splitChunkToLines,
    beatsFromTimeline,
  };
})();

if (typeof window !== 'undefined') {
  Object.assign(window, { NarrationStageLib });
}


const { NarrationStage, Cue, useNarration, useSceneFade } = NarrationStageLib;

const C = {
  void: '#0C0C0E',
  ink: '#F4EFE4',
  mute: 'rgba(244,239,228,0.45)',
  gold: '#E6C15A',
  dim: '#2A2A2E',
};
const F = {
  display: '"Source Serif 4", "Noto Serif SC", Georgia, serif',
  body: '"Noto Sans SC", "PingFang SC", sans-serif',
  mono: '"JetBrains Mono", ui-monospace, monospace',
};
const expoOut = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const lerpGlyph = (from, to, t) => ({
  x: lerp(from.x, to.x, t),
  y: lerp(from.y, to.y, t),
  scale: lerp(from.scale, to.scale, t),
  opacity: lerp(from.opacity, to.opacity, t),
});

// 两枚 glyph 贯穿全片：? → token → 人工/智能 → 角落 token
const HERO_KEYS = {
  intro:    { a: { x: 50, y: 44, scale: 1.55, opacity: 1, label: '?' },     b: { x: 50, y: 44, scale: 1.55, opacity: 0, label: '?' } },
  'token-1':{ a: { x: 50, y: 44, scale: 1.05, opacity: 1, label: 'token' }, b: { x: 50, y: 44, scale: 1.05, opacity: 0, label: 'token' } },
  'token-2':{ a: { x: 32, y: 48, scale: 1.0,  opacity: 1, label: '人工' },  b: { x: 68, y: 48, scale: 1.0,  opacity: 1, label: '智能' } },
  ending:   { a: { x: 50, y: 78, scale: 0.28, opacity: 0.55, label: 'token' }, b: { x: 50, y: 78, scale: 0.28, opacity: 0, label: 'token' } },
};
const SCENE_ORDER = ['intro', 'token-1', 'token-2', 'ending'];

const useWallClock = () => {
  const [now, setNow] = React.useState(0);
  React.useEffect(() => {
    let raf;
    const t0 = performance.now();
    const tick = (t) => { setNow((t - t0) / 1000); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  return now;
};

const HeroAnchor = () => {
  const { scene, sceneMorph } = useNarration();
  const now = useWallClock();
  if (!scene) return null;
  const idx = SCENE_ORDER.indexOf(scene.id);
  const prevId = idx > 0 ? SCENE_ORDER[idx - 1] : scene.id;
  const from = HERO_KEYS[prevId];
  const to = HERO_KEYS[scene.id];
  const t = expoOut(Math.min(1, Math.max(0, sceneMorph)));
  const a = lerpGlyph(from.a, to.a, t);
  const b = lerpGlyph(from.b, to.b, t);
  const labelA = t < 0.45 ? from.a.label : to.a.label;
  const labelB = t < 0.45 ? from.b.label : to.b.label;
  const breath = 1 + Math.sin(now * 0.65) * 0.02;
  const render = (key, pos, label, extraDx) => (
    <div key={key} style={{
      position: 'absolute',
      left: (pos.x + extraDx) * 19.2,
      top: (pos.y + Math.sin(now * 0.4 + extraDx) * 0.35) * 10.8,
      transform: `translate(-50%, -50%) scale(${pos.scale * breath})`,
      opacity: pos.opacity,
      fontFamily: label === 'token' || label === '?' ? F.mono : F.display,
      fontSize: 220,
      fontWeight: 700,
      color: C.gold,
      letterSpacing: label === 'token' ? '0.04em' : '-0.03em',
      lineHeight: 1,
      pointerEvents: 'none',
      willChange: 'transform, opacity',
    }}>{label}</div>
  );
  return (
    <div style={{ position: 'absolute', inset: 0 }}>
      {render('a', a, labelA, Math.cos(now * 0.3) * 0.4)}
      {render('b', b, labelB, Math.sin(now * 0.27) * 0.4)}
    </div>
  );
};

const BackgroundDrift = () => {
  const now = useWallClock();
  const x = 50 + Math.sin(now * 0.07) * 8;
  const y = 42 + Math.cos(now * 0.05) * 6;
  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: `radial-gradient(ellipse 900px 640px at ${x}% ${y}%, #16151A 0%, ${C.void} 62%)`,
      pointerEvents: 'none',
    }} />
  );
};

const Caption = ({ sceneId, kicker, title, sub }) => {
  const op = useSceneFade(sceneId, 0.45, 0.4);
  return (
    <div style={{
      position: 'absolute', left: 0, right: 0, top: 88,
      textAlign: 'center', opacity: op, pointerEvents: 'none',
    }}>
      {kicker && <div style={{ fontFamily: F.mono, fontSize: 14, letterSpacing: '0.28em', color: C.mute, marginBottom: 14 }}>{kicker}</div>}
      {title && <div style={{ fontFamily: F.body, fontSize: 36, fontWeight: 400, color: C.ink, letterSpacing: '0.04em' }}>{title}</div>}
      {sub && <div style={{ fontFamily: F.body, fontSize: 22, color: C.mute, marginTop: 10 }}>{sub}</div>}
    </div>
  );
};

const IntroAux = () => (
  <>
    <Caption sceneId="intro" kicker="KNOWLEDGE STAGE" title="AI 是怎么理解我们的话的" />
    <Cue id="question">{(triggered, p) => (
      <div style={{
        position: 'absolute', bottom: 120, left: 0, right: 0, textAlign: 'center',
        opacity: p, transform: `translateY(${(1 - p) * 12}px)`,
        fontFamily: F.body, fontSize: 28, color: C.mute,
      }}>{triggered ? '它看见的不是字，是切块。' : ''}</div>
    )}</Cue>
  </>
);

const Token1Aux = () => (
  <>
    <Caption sceneId="token-1" title="它不认识汉字" />
    <Cue id="reveal">{(triggered, p) => triggered && (
      <div style={{
        position: 'absolute', bottom: 140, left: 0, right: 0, textAlign: 'center',
        opacity: p, fontFamily: F.mono, fontSize: 18, letterSpacing: '0.22em', color: C.gold,
      }}>MINIMAL UNIT</div>
    )}</Cue>
  </>
);

const Token2Aux = () => (
  <>
    <Caption sceneId="token-2" title="token = AI 的最小信息单位" sub="「人工智能」在模型眼里往往是两块" />
    <Cue id="split">{(triggered, p) => triggered && (
      <div style={{
        position: 'absolute', top: 720, left: 0, right: 0,
        display: 'flex', justifyContent: 'center', gap: 80,
        opacity: p,
      }}>
        <div style={{ fontFamily: F.mono, fontSize: 16, letterSpacing: '0.2em', color: C.mute }}>TOKEN · 01</div>
        <div style={{ fontFamily: F.mono, fontSize: 16, letterSpacing: '0.2em', color: C.mute }}>TOKEN · 02</div>
      </div>
    )}</Cue>
  </>
);

const EndingAux = () => (
  <>
    <Caption sceneId="ending" kicker="CONTEXT WINDOW" />
    <Cue id="context">{(triggered, p) => (
      <div style={{
        position: 'absolute', left: 0, right: 0, top: 280, textAlign: 'center',
        opacity: p, transform: `translateY(${(1 - p) * 18}px)`,
      }}>
        <div style={{ fontFamily: F.display, fontSize: 140, fontWeight: 800, color: C.ink, letterSpacing: '-0.03em', lineHeight: 0.9 }}>
          1,000,000
        </div>
        <div style={{ marginTop: 28, fontFamily: F.body, fontSize: 32, color: C.mute }}>
          一次能记住多少个这样的小块
        </div>
      </div>
    )}</Cue>
  </>
);

const App = () => (
  <NarrationStage timeline={TIMELINE} mode="speaker" width={1920} height={1080} background={C.void}>
    <BackgroundDrift />
    <HeroAnchor />
    <IntroAux />
    <Token1Aux />
    <Token2Aux />
    <EndingAux />
  </NarrationStage>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
